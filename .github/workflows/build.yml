name: build-installers

# Rebuild both installers on every push and on demand. Pushing a version tag
# (v*) additionally publishes a GitHub Release with both installers attached.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install app + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import chronogate; print(chronogate.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Freeze (PyInstaller one-folder)
        run: pyinstaller packaging/chronogate.spec --noconfirm

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} packaging\chronogate.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ChronoGate-Windows-Setup-${{ steps.ver.outputs.version }}
          path: dist/ChronoGate-Setup-*.exe
          if-no-files-found: error

  macos:
    # Two native builds: Apple Silicon on the arm64 runner, Intel on the last
    # x86_64 runner GitHub offers. A 2016-era Intel Mac can only run the x86_64
    # dmg; an arm64-only build fails there with "not supported on this Mac".
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14     # Apple Silicon -> native arm64
            arch: arm64
          - runner: macos-13     # Intel -> native x86_64
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install app + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Read version
        id: ver
        run: echo "version=$(python -c 'import chronogate; print(chronogate.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Freeze (PyInstaller .app)
        run: pyinstaller packaging/chronogate.spec --noconfirm

      - name: Ad-hoc code sign (free; lets an unsigned app launch)
        # An ad-hoc signature ("-") costs nothing and is not notarization, but it
        # stops the "damaged and can't be opened" hard-fail on Apple Silicon. The
        # user still clears a one-time Gatekeeper warning (see the release notes).
        run: |
          codesign --force --deep --sign - dist/ChronoGate.app
          codesign --verify --verbose dist/ChronoGate.app

      - name: Build disk image
        run: packaging/make_dmg.sh ${{ steps.ver.outputs.version }} ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: ChronoGate-macOS-${{ matrix.arch }}-${{ steps.ver.outputs.version }}
          path: dist/ChronoGate-*.dmg
          if-no-files-found: error

  # On a version tag, gather both installers and publish a GitHub Release.
  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create the release
    steps:
      - uses: actions/checkout@v4      # for .github/release-install-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts     # each artifact lands in artifacts/<name>/

      - name: Build release notes (install/bypass steps + auto changelog)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body > changelog.md || echo "" > changelog.md
          cat .github/release-install-notes.md changelog.md > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ChronoGate ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            artifacts/*/ChronoGate-*.exe \
            artifacts/*/ChronoGate-*.dmg
