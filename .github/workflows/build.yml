name: build-installers

# Rebuild both installers on every push and on demand. Pushing a version tag
# (v*) additionally publishes a GitHub Release with both installers attached.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install app + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import chronogate; print(chronogate.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Freeze (PyInstaller one-folder)
        run: pyinstaller packaging/chronogate.spec --noconfirm

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} packaging\chronogate.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ChronoGate-Windows-Setup-${{ steps.ver.outputs.version }}
          path: dist/ChronoGate-Setup-*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest      # Apple Silicon runner -> native arm64 build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install app + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Read version
        id: ver
        run: echo "version=$(python -c 'import chronogate; print(chronogate.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Freeze (PyInstaller .app)
        run: pyinstaller packaging/chronogate.spec --noconfirm

      - name: Build disk image
        run: packaging/make_dmg.sh ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: ChronoGate-macOS-${{ steps.ver.outputs.version }}
          path: dist/ChronoGate-*.dmg
          if-no-files-found: error

  # On a version tag, gather both installers and publish a GitHub Release.
  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts     # each artifact lands in artifacts/<name>/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ChronoGate ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*/ChronoGate-*.exe \
            artifacts/*/ChronoGate-*.dmg
