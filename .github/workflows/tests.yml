name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen   # headless Qt on every OS
      MPLBACKEND: Agg
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: System libs for headless Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y
             libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Analysis tests (synthetic data, no files needed)
        run: python test_gating.py

      - name: IRF reconvolution tests (the lifetime-fit engine)
        run: python test_reconv.py

      - name: Loader tests (.sdt mapping; real-file test skips when absent)
        run: python test_loader_sdt.py

      - name: UI smoke tests (offscreen; skip if no sample data)
        run: python test_ui_smoke.py
