<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FFFFFF" stroke="#E3E7EC" stroke-width="2"/>
  <!-- gate bands: early (orange) and late (green) -->
  <rect x="19" y="12" width="12" height="38" fill="#E8833A" opacity="0.22"/>
  <rect x="31" y="12" width="12" height="38" fill="#2FA84F" opacity="0.18"/>
  <!-- baseline -->
  <line x1="10" y1="50" x2="54" y2="50" stroke="#D7DCE3" stroke-width="2" stroke-linecap="round"/>
  <!-- fluorescence decay curve -->
  <path d="M10 15 C 19 15, 21 47, 54 49" fill="none" stroke="#2563EB"
        stroke-width="4" stroke-linecap="round"/>
</svg>
