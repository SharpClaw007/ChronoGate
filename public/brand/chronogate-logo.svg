<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ChronoGate logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#243244"/>
      <stop offset="1" stop-color="#161E29"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <rect x="2" y="2" width="92" height="92" rx="20" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="91" height="91" rx="19.5" fill="none" stroke="#3A4658" stroke-width="1"/>
  <!-- time gate: a highlighted window over the decay -->
  <rect x="30" y="20" width="19" height="52" fill="#E8833A" fill-opacity="0.20"/>
  <line x1="30" y1="20" x2="30" y2="72" stroke="#E8833A" stroke-width="2" stroke-linecap="round"/>
  <line x1="49" y1="20" x2="49" y2="72" stroke="#E8833A" stroke-width="2" stroke-linecap="round"/>
  <!-- baseline -->
  <line x1="20" y1="72" x2="80" y2="72" stroke="#46536633" stroke-width="0"/>
  <line x1="20" y1="72" x2="80" y2="72" stroke="#516074" stroke-width="1.5" stroke-linecap="round"/>
  <!-- fluorescence decay curve -->
  <path d="M20 70 C 23 40, 25 24, 30 24 C 36 24, 40 44, 49 56 C 58 66, 70 69, 80 70"
        fill="none" stroke="#4C8DFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- peak marker -->
  <circle cx="30" cy="24" r="3.6" fill="#F0189B"/>
</svg>
