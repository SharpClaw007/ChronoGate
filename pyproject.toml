[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronogate"
version = "0.6.0"
description = "Interactive time-gating, rapid-lifetime & phasor viewer for PicoQuant FLIM (.ptu) data"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "jr101" }]
keywords = ["FLIM", "TCSPC", "PicoQuant", "PTU", "fluorescence", "lifetime", "phasor", "microscopy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "ptufile>=2026.6.6",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tifffile>=2023.7.10",
    "PySide6>=6.7",
]

[project.urls]
Homepage = "https://github.com/jr101/ChronoGate"

[project.scripts]
chronogate = "chronogate.__main__:main"

[project.gui-scripts]
chronogate-gui = "chronogate.__main__:main"

[tool.setuptools]
# The analysis package plus the shipped SVG logomark; data files are excluded.
packages = ["chronogate", "chronogate.ui"]

[tool.setuptools.package-data]
"chronogate.ui" = ["assets/*.svg"]
