[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronogate"
version = "0.18.2"
description = "Interactive time-gating, rapid-lifetime & phasor viewer for PicoQuant FLIM (.ptu) data"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "SharpClaw007", email = "juanquiviri@gmail.com" }]
keywords = ["FLIM", "TCSPC", "PicoQuant", "PTU", "fluorescence", "lifetime", "phasor", "microscopy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
]
# The single source of dependencies (the .app launcher installs `-e .` from here;
# there is no requirements.txt). All licences are permissive (BSD / MIT / PSF /
# LGPL), no GPL: ptufile/numpy/scipy/sdtfile/tifffile BSD-3, matplotlib PSF/BSD,
# PySide6 LGPL-3.
dependencies = [
    "ptufile>=2026.6.6",     # reads PicoQuant .ptu TTTR files (primary format)
    "sdtfile>=2023",         # reads Becker & Hickl .sdt FLIM files (optional)
    "numpy>=1.24",           # the cube, prefix sum, all numerics
    "scipy>=1.10",           # least_squares for the IRF-reconvolution fit
    "matplotlib>=3.7",       # embedded decay & image plots
    "tifffile>=2023.7.10",   # 16-bit raw TIFF export
    "PySide6>=6.7",          # the native Qt desktop UI
]

# Build-time only -- for regenerating the SOP PDF (docs/sop/). Deliberately NOT
# app dependencies, so the installers never bundle weasyprint/pango:
#   pip install -e ".[docs]"
[project.optional-dependencies]
docs = ["markdown>=3.5", "weasyprint>=60"]

[project.urls]
Homepage = "https://github.com/SharpClaw007/ChronoGate"

[project.scripts]
chronogate = "chronogate.__main__:main"

[project.gui-scripts]
chronogate-gui = "chronogate.__main__:main"

[tool.setuptools]
# The analysis package plus the shipped SVG logomark; data files are excluded.
packages = ["chronogate", "chronogate.ui"]

[tool.setuptools.package-data]
"chronogate.ui" = ["assets/*.svg"]
